name: mysql_db
services:
  mysql_db:
    container_name: mysql_db
    image: mysql:9.7
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    restart: always
    healthcheck:
      test: mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1
      interval: 60s
      retries: 5
      start_period: 1s
      timeout: 10s
    ports:
      - ${DB_PORT}:3306
    volumes:
      - ./database/data:/var/lib/mysql
      - ./backups:/backups
    extra_hosts:
      - host.docker.internal:host-gateway
